{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-4 mt-md-5">
<div class="col-md-6 col-lg-5">
<div class="card wine-card p-4">
<h2 class="mb-4">{{ t.register }}</h2>
<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3">
<label class="form-label">{{ t.username }}</label>
<input class="form-control" name="username" minlength="3" maxlength="80" required>
</div>
<div class="mb-3">
<label class="form-label">{{ t.email }}</label>
<input class="form-control" type="email" name="email" required>
</div>
<div class="mb-3">
<label class="form-label">{{ t.password }}</label>
<input class="form-control" type="password" name="password" minlength="12" required>
</div>
<button class="btn btn-wine w-100 mt-2">{{ t.register }}</button>
</form>
<p class="mt-4 mb-0 text-muted">{{ t.have_account }} <a href="{{ url_for('login') }}">{{ t.login }}</a></p>
</div>
</div>
</div>
{% endblock %}
