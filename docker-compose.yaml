
services:
  db:
    image: mariadb:11.4
    container_name: wine_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: winejournal
      MARIADB_USER: wineuser
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - wine_db_data:/var/lib/mysql
    networks:
      - wine_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: ./app
    container_name: wine_web
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://wineuser:${DB_PASSWORD}@db:3306/winejournal
      SECRET_KEY: ${SECRET_KEY}
      UPLOAD_FOLDER: /app/static/uploads
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAX_CONTENT_LENGTH: 10485760
    ports:
      - "5000:5000"
    volumes:
      - wine_uploads:/app/static/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wine_network

volumes:
  wine_db_data:
  wine_uploads:

networks:
  wine_network:
    driver: bridge
